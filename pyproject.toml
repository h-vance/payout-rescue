[project]
name = "payout-rescue"
version = "0.1.0"
description = "A workflow that classifies failed marketplace payouts, drafts the fix for the seller, and retries after an approval."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi",
    "jinja2",
    "python-dotenv",
    "stripe",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payout_rescue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls a real service (Stripe or a model)"]
# A plain run never calls a real service. Integration tests are opt-in: pytest -m integration
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
